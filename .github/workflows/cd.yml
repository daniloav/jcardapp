name: CD · Deploy

# Uma VM (GCP e2-micro, sempre gratuita) + Postgres no Neon + imagens no GHCR.
#
#   1) build : compila no runner e publica as imagens linux/amd64.
#   2) deploy: a VM só faz `docker compose pull && up` — nada de build lá.
#
# Por que o build não está no Dockerfile: a e2-micro tem 1 GB e uma vCPU
# compartilhada; um build de Maven/Node ali levaria muito tempo e provavelmente
# estouraria a memória. Ver docs/CICD.md.
#
# Enquanto os secrets DEPLOY_* estiverem vazios o deploy roda em MODO MOCK, e a
# esteira fica verde antes de a VM existir.

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_BACKEND: ghcr.io/daniloav/jcard-backend
  IMAGE_FRONTEND: ghcr.io/daniloav/jcard-frontend

jobs:
  build:
    name: Build e push das imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      # ---- compila nativo ----
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Gerar chaves JWT de build (as reais vêm dos secrets em runtime)
        run: bash scripts/gen-jwt-keys.sh
      - name: Empacotar backend
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build

      # ---- empacota (amd64 nativo: sem QEMU, sem cross-compile) ----
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Backend → linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:latest,${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend → linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:latest,${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Em repositório PRIVADO o GHCR tem 500 MB no plano Free e cada deploy
      # publica uma camada nova — sem esta limpeza a cota estoura em poucos meses.
      # Em repositório PÚBLICO o armazenamento é livre, mas manter só as últimas
      # versões continua sendo higiene. Guardamos 5, o bastante para rollback
      # (JCARD_IMAGE_TAG=<sha>).
      - name: Apagar versões antigas do backend
        continue-on-error: true   # falta de permissão não pode derrubar o deploy
        uses: actions/delete-package-versions@v5
        with:
          package-name: jcard-backend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Apagar versões antigas do frontend
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: jcard-frontend
          package-type: container
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

  deploy:
    name: Deploy na VM (pull)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
      JWT_PRIV: ${{ secrets.JCARD_JWT_PRIVATE_KEY }}
      JWT_PUB: ${{ secrets.JCARD_JWT_PUBLIC_KEY }}
      GHCR_USER: ${{ secrets.JCARD_GHCR_USER }}
      GHCR_PAT: ${{ secrets.JCARD_GHCR_PAT }}
      APP_DIR: jcardapp
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Os secrets de deploy estão preenchidos?
        id: cfg
        run: |
          if [ -n "$SSH_HOST" ] && [ "$SSH_HOST" != "CHANGEME" ] \
             && [ -n "$SSH_USER" ] && [ -n "$SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: MOCK — VM ainda não provisionada
        if: steps.cfg.outputs.ready != 'true'
        run: |
          echo "::notice title=Deploy MOCK::Secrets DEPLOY_* ausentes. As imagens foram publicadas no GHCR; o deploy roda assim que a VM existir."

      - name: Configurar SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Enviar o .env de produção
        if: steps.cfg.outputs.ready == 'true' && env.ENV_FILE != ''
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" "mkdir -p ~/$APP_DIR"
          printf '%s' "$ENV_FILE" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cat > ~/$APP_DIR/.env && chmod 600 ~/$APP_DIR/.env"

      - name: Sincronizar compose, Caddyfile e scripts
        if: steps.cfg.outputs.ready == 'true'
        run: |
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30" \
            docker-compose.yml Caddyfile "$SSH_USER@$SSH_HOST:~/$APP_DIR/"
          rsync -az -e "ssh -i ~/.ssh/id_deploy" scripts/ "$SSH_USER@$SSH_HOST:~/$APP_DIR/scripts/"

      - name: Gravar as chaves JWT no volume ./keys
        if: steps.cfg.outputs.ready == 'true' && env.JWT_PRIV != '' && env.JWT_PUB != ''
        run: |
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "mkdir -p ~/$APP_DIR/keys && chmod 700 ~/$APP_DIR/keys"
          printf '%s' "$JWT_PRIV" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cat > ~/$APP_DIR/keys/privateKey.pem && chmod 600 ~/$APP_DIR/keys/privateKey.pem"
          printf '%s' "$JWT_PUB"  | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cat > ~/$APP_DIR/keys/publicKey.pem"

      - name: Pull e up (sem build na VM)
        if: steps.cfg.outputs.ready == 'true'
        run: |
          printf '%s' "$GHCR_PAT" | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" "
            cd ~/$APP_DIR &&
            docker compose --env-file .env pull &&
            docker compose --env-file .env up -d --remove-orphans &&
            docker compose ps &&
            docker image prune -f >/dev/null 2>&1 || true
          "

      - name: Healthcheck
        if: steps.cfg.outputs.ready == 'true'
        env:
          URL: ${{ vars.PROD_URL || 'https://jcardapp.duckdns.org' }}
        run: |
          echo "Aguardando $URL ..."
          for i in $(seq 1 18); do
            if curl -fsS "$URL/q/health" >/dev/null 2>&1; then echo "✅ No ar."; exit 0; fi
            sleep 10
          done
          echo "::error title=Healthcheck::App não respondeu em ~3min"
          exit 1
