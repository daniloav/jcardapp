# Stack completa numa VM só (jcard-server): Postgres + backend + frontend + Caddy.
#
# Para ~10 pessoas uma VM basta com folga, e a topologia de 2 VMs do projeto EBD
# só existiu lá porque aquelas máquinas tinham 1 GB de RAM. Aqui a A1 tem 12 GB,
# então o banco e o app convivem sem apertar.
#
# Uso na VM:  docker compose --env-file .env up -d
services:
  db:
    image: postgres:16-alpine
    container_name: jcard-postgres
    restart: unless-stopped
    mem_limit: 3g
    # Sem `ports:` de propósito. O Postgres fica acessível SÓ pela rede interna
    # do compose — nem no IP privado, nem no público. É mais seguro que a
    # topologia de 2 VMs, onde a porta 5432 precisava trafegar entre máquinas.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=768MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "max_connections=30"
      - "-c"
      - "work_mem=16MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jcard}
      POSTGRES_USER: ${POSTGRES_USER:-jcard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - jcard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcard} -d ${POSTGRES_DB:-jcard}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [jcard-net]

  backend:
    image: ghcr.io/daniloav/jcard-backend:${JCARD_IMAGE_TAG:-latest}
    container_name: jcard-backend
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Chaves JWT gravadas pelo CD a partir dos secrets: a imagem fica sem
      # segredo e os tokens sobrevivem ao deploy.
      - ./keys:/keys:ro
    environment:
      JCARD_JWT_PUBLIC_LOCATION: /keys/publicKey.pem
      JCARD_JWT_PRIVATE_LOCATION: /keys/privateKey.pem
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jcard}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-jcard}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      JCARD_ADMIN_NOME: ${JCARD_ADMIN_NOME:-Titular do cartao}
      JCARD_ADMIN_LOGIN: ${JCARD_ADMIN_LOGIN:-admin}
      JCARD_ADMIN_EMAIL: ${JCARD_ADMIN_EMAIL:-admin@jcardapp.local}
      JCARD_ADMIN_SENHA: ${JCARD_ADMIN_SENHA:?defina JCARD_ADMIN_SENHA no .env}
      JCARD_SENHA_PADRAO: ${JCARD_SENHA_PADRAO:-12345678}
      JCARD_APP_URL: ${JCARD_APP_URL:-https://jcardapp.duckdns.org}
      JCARD_NOTIF_ENABLED: ${JCARD_NOTIF_ENABLED:-false}
      JCARD_MAIL_FROM: ${JCARD_MAIL_FROM:-}
      JCARD_SMTP_HOST: ${JCARD_SMTP_HOST:-smtp.gmail.com}
      JCARD_SMTP_PORT: ${JCARD_SMTP_PORT:-587}
      JCARD_SMTP_USER: ${JCARD_SMTP_USER:-}
      JCARD_SMTP_PASS: ${JCARD_SMTP_PASS:-}
      # Regexes do parser: permitem calibrar um layout novo do Itaú mexendo só
      # no .env + restart, sem build nem deploy. Vazias = usa o padrão.
      JCARD_PARSER_ITAU_PORTADOR: ${JCARD_PARSER_ITAU_PORTADOR:-}
      JCARD_PARSER_ITAU_LANCAMENTO: ${JCARD_PARSER_ITAU_LANCAMENTO:-}
      JCARD_PARSER_ITAU_TOTAL: ${JCARD_PARSER_ITAU_TOTAL:-}
      JCARD_PARSER_ITAU_VENCIMENTO: ${JCARD_PARSER_ITAU_VENCIMENTO:-}
    networks: [jcard-net]

  frontend:
    image: ghcr.io/daniloav/jcard-frontend:${JCARD_IMAGE_TAG:-latest}
    container_name: jcard-frontend
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [backend]
    networks: [jcard-net]

  caddy:
    image: caddy:2-alpine
    container_name: jcard-caddy
    restart: unless-stopped
    mem_limit: 128m
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [jcard-net]

volumes:
  jcard_pgdata:
  caddy_data:
  caddy_config:

networks:
  jcard-net:
    driver: bridge
