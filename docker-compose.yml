# Stack da VM (GCP e2-micro · 1 vCPU / 1 GB): caddy + frontend + backend.
#
# NÃO há Postgres aqui: o banco é o Neon (serverless, gerenciado, gratuito).
# É justamente o que faz 1 GB bastar — foi o Postgres na mesma máquina que
# obrigava a topologia de duas VMs na tentativa anterior, na Oracle.
#
# Uso na VM:  docker compose --env-file .env up -d
services:
  backend:
    image: ghcr.io/daniloav/jcard-backend:${JCARD_IMAGE_TAG:-latest}
    container_name: jcard-backend
    restart: unless-stopped
    # Medido na e2-micro: dos 955 MB, o SO + daemon do Docker já ocupam ~456,
    # sobrando ~498. Tirando ~50 para nginx e Caddy, restam ~450 para o backend.
    # 512m com MaxRAMPercentage=60 dá ~307 MB de heap — cabe, e os 2 GB de swap
    # cobrem o pico do parse de PDF (que acontece uma vez por mês).
    mem_limit: ${JCARD_MEM_BACKEND:-512m}
    volumes:
      # Chaves JWT gravadas pelo CD a partir dos secrets: a imagem fica sem
      # segredo e os tokens sobrevivem ao deploy.
      - ./keys:/keys:ro
    # Passa adiante SÓ o que existir no .env — é o ponto central desta escolha.
    #
    # Com `environment: VAR: ${VAR:-}`, uma variável ausente vira **string
    # vazia**, e o SmallRye Config trata vazio como "não encontrado": a
    # propriedade obrigatória some e o app entra em ciclo de reinício. Foi o que
    # aconteceu com as regexes do parser no primeiro deploy.
    #
    # `env_file` não tem esse efeito: o que não está no arquivo simplesmente não
    # é definido, e o application.properties mantém o valor padrão. Por isso as
    # regexes do parser (JCARD_PARSER_ITAU_*) ficam comentadas no .env.example —
    # descomente só para calibrar um layout novo.
    env_file: .env
    environment:
      # Estes não vêm do .env: são fixos da topologia ou precisam de tradução
      # para o nome que o Quarkus espera. O que está aqui vence o env_file.
      JCARD_JWT_PUBLIC_LOCATION: /keys/publicKey.pem
      JCARD_JWT_PRIVATE_LOCATION: /keys/privateKey.pem
      # Neon exige TLS. A string vem do painel do Neon (ver .env.example).
      QUARKUS_DATASOURCE_JDBC_URL: ${JCARD_DB_URL:?defina JCARD_DB_URL no .env}
      QUARKUS_DATASOURCE_USERNAME: ${JCARD_DB_USER:?defina JCARD_DB_USER no .env}
      QUARKUS_DATASOURCE_PASSWORD: ${JCARD_DB_PASS:?defina JCARD_DB_PASS no .env}
    networks: [jcard-net]

  frontend:
    image: ghcr.io/daniloav/jcard-frontend:${JCARD_IMAGE_TAG:-latest}
    container_name: jcard-frontend
    restart: unless-stopped
    mem_limit: 96m
    depends_on: [backend]
    networks: [jcard-net]

  caddy:
    image: caddy:2-alpine
    container_name: jcard-caddy
    restart: unless-stopped
    mem_limit: 96m
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [jcard-net]

volumes:
  caddy_data:
  caddy_config:

networks:
  jcard-net:
    driver: bridge
