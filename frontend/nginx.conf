server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota do Angular cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do backend Quarkus (nome do serviço no compose)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # O upload da fatura em PDF passa por aqui.
        client_max_body_size 15m;
        proxy_read_timeout 120s;
    }

    location /q/ {
        proxy_pass http://backend:8080/q/;
        proxy_set_header Host $host;
    }

    # O service worker não pode ficar em cache: senão um deploy novo demora a
    # chegar no celular de quem instalou o PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Assets têm hash no nome — cache longo é seguro.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
