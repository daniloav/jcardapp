quarkus.application.name=jcard

# ------------------------------------------------------------------ banco --
# O schema é dono do Flyway. Toda mudança de modelo exige nova migration V2__, V3__...
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jcard
quarkus.datasource.username=jcard
quarkus.datasource.password=jcard
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# --- pool calibrado para Postgres serverless (Neon) ---------------------
# O plano gratuito do Neon dá 100 CU-hours/mês e o compute hiberna sozinho
# após ~5 min SEM CONEXÃO. Um pool segurando conexão ociosa manteria o banco
# acordado 24/7 (~180 CU-hours) e estouraria o gratuito.
# Por isso: nenhuma conexão mínima, e as ociosas caem rápido.
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.idle-removal-interval=2M
# Acordar do zero leva ~1s; a folga evita erro na primeira requisição do dia.
quarkus.datasource.jdbc.acquisition-timeout=30S

# -------------------------------------------------------------- segurança --
# Chaves RS256. Em produção vêm do volume /keys (gravado pelo CD a partir dos
# secrets), então os tokens sobrevivem a deploy. Em dev caem no classpath.
mp.jwt.verify.publickey.location=${JCARD_JWT_PUBLIC_LOCATION:publicKey.pem}
mp.jwt.verify.issuer=https://jcardapp.duckdns.org
smallrye.jwt.sign.key.location=${JCARD_JWT_PRIVATE_LOCATION:privateKey.pem}
smallrye.jwt.new-token.issuer=https://jcardapp.duckdns.org
jcard.jwt.duracao-horas=12

# CORS fechado: em prod o front é same-origin (nginx faz o proxy de /api).
quarkus.http.cors=false
quarkus.http.limits.max-body-size=15M

# ------------------------------------------------------------------ upload --
# O PDF da fatura chega como multipart. Só o texto extraído é persistido.
quarkus.http.body.handle-file-uploads=true
quarkus.http.body.delete-uploaded-files-on-end=true

# ------------------------------------------------------------------ e-mail --
# Envio pelo SMTP do próprio Gmail com senha de app: o e-mail sai assinado pelo
# Google (DMARC ok). Relays de terceiros rejeitam remetente @gmail.com.
jcard.notificacoes.enabled=${JCARD_NOTIF_ENABLED:false}
quarkus.mailer.from=${JCARD_MAIL_FROM:JcardApp <no-reply@jcardapp.duckdns.org>}
quarkus.mailer.host=${JCARD_SMTP_HOST:smtp.gmail.com}
quarkus.mailer.port=${JCARD_SMTP_PORT:587}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.username=${JCARD_SMTP_USER:}
quarkus.mailer.password=${JCARD_SMTP_PASS:}
jcard.app.url=${JCARD_APP_URL:https://jcardapp.duckdns.org}

# ------------------------------------------------------------------- seed --
jcard.admin.nome=${JCARD_ADMIN_NOME:Titular do cartao}
jcard.admin.login=${JCARD_ADMIN_LOGIN:admin}
jcard.admin.email=${JCARD_ADMIN_EMAIL:admin@jcardapp.local}
jcard.admin.senha=${JCARD_ADMIN_SENHA:admin123}
# Senha dada a todo utilizador novo; o app força a troca no 1º acesso.
jcard.usuario.senha-padrao=${JCARD_SENHA_PADRAO:12345678}

# ------------------------------------------------------- parser da fatura --
# Regexes externalizadas para calibrar o layout do Itaú sem recompilar.
# Grupos esperados:
#   portador  -> 1=nome, 2=final(4 dígitos)
#   lancamento-> 1=data(dd/MM), 2=descrição, 3=valor(pt-BR)
#   total     -> 1=valor;  vencimento -> 1=data(dd/MM/yyyy)
jcard.parser.itau.portador=^\\s*([A-ZÀ-Ú][A-ZÀ-Ú .'\\-]{2,})\\s*[\\(\\-]?\\s*(?:final|FINAL)\\s*[:\\s]?\\s*(\\d{4})\\s*\\)?\\s*$
jcard.parser.itau.lancamento=^\\s*(\\d{2}/\\d{2})\\s+(.{3,}?)\\s+(-?\\s*[\\d.]{1,12},\\d{2})\\s*$
jcard.parser.itau.total=(?i)total\\s+desta\\s+fatura\\D{0,10}?([\\d.]{1,12},\\d{2})
jcard.parser.itau.vencimento=(?i)vencimento\\D{0,20}?(\\d{2}/\\d{2}/\\d{4})

# --------------------------------------------------------------- rotinas --
# Lembrete diário aos utilizadores com lançamentos pendentes de avaliação.
jcard.lembrete.cron=${JCARD_LEMBRETE_CRON:0 0 12 * * ?}

# ------------------------------------------------------------------- logs --
quarkus.log.level=INFO
quarkus.log.category."br.com.jcard".level=DEBUG

# =========================== perfil DEV ====================================
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jcard
%dev.jcard.notificacoes.enabled=true
# mock: não envia de verdade, só loga o e-mail
%dev.quarkus.mailer.mock=true
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:4200
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization

# =========================== perfil TEST ===================================
# Banco separado: clean-at-start apaga tudo a cada execução, e isso não pode
# acontecer na base de desenvolvimento.
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/jcard_test
%test.quarkus.mailer.mock=true
%test.jcard.notificacoes.enabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
